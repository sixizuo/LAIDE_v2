
adapter speed 2000

reset_config srst_only

transport select jtag

set _CHIPNAME la132


#irlen ir寄存器长度

jtag newtap $_CHIPNAME cpu -irlen 4 -ircapture 0x01 -irmask 0x1f -expected-id 0x5a5a5a5a -ignore-bypass

set _TARGETNAME $_CHIPNAME.cpu
set _ENDIAN little
target create $_TARGETNAME loongarch_la132 -endian $_ENDIAN -chain-position $_TARGETNAME

#---------------------------------------------------------------------
# work area: 必须是"既能取指又能读写"的地址 (2026-10-30 实测修正)
#---------------------------------------------------------------------
#  原来写 0x80000000: 本工程里 0x80000000 只有**数据**窗口
#    (dbus0, 8KB -> Dram_8k), 取指窗口 ibus3_valid=0,
#    ibus0=0x1C000000(flash/BRAM) ibus1=0x9F000000。
#  openocd 的 verify / run_and_wait 会往 work area 里塞一小段算法
#  再让内核执行, 在 0x80000000 取到的是垃圾 ->
#     Error: timed out while waiting for target halted
#     Error: Failed to enter Debug Mode!
#     Error: ** Verify Failed **
#  内核进入异常循环后再也 halt 不住, 只能重下 bit 流恢复。
#  改放 flash 这块 BRAM 的最后 4KB (0x1C01F000~0x1C01FFFF):
#  可读可写可执行, 程序 < 124KB 时不冲突。
#  实测: write + verify_image 全部通过 (verified 9352 bytes)。
#---------------------------------------------------------------------
set _WORKAREASIZE 0x1000
$_TARGETNAME configure -work-area-phys 0x1c01f000 -work-area-size $_WORKAREASIZE -work-area-backup 0

#0x1c000000 128k
set _FLASHNAME $_CHIPNAME.flash
set _FLASH_SIZE 0x20000
flash bank $_FLASHNAME la132 0x1c000000 $_FLASH_SIZE 0 0 $_TARGETNAME
